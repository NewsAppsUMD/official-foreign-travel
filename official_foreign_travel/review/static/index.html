<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Report Review</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <h1>Report Review</h1>
  <div id="progress"></div>
  <select id="status-filter">
    <option value="">All statuses</option>
    <option value="unreviewed">Unreviewed</option>
    <option value="confirmed_ok">Confirmed OK</option>
    <option value="edited">Edited</option>
  </select>
  <select id="flag-filter">
    <option value="">All flags</option>
  </select>
  <label id="flagged-only-label">
    <input type="checkbox" id="flagged-only" checked> Flagged only
  </label>
  <table id="reports-table">
    <thead>
      <tr>
        <th data-sort="report_id">Report ID</th>
        <th data-sort="sponsor">Sponsor</th>
        <th data-sort="source_file">Source File</th>
        <th>Flags</th>
        <th data-sort="traveler_count">Travelers</th>
        <th data-sort="status">Status</th>
      </tr>
    </thead>
    <tbody id="reports-body"></tbody>
  </table>
  <script src="/app.js"></script>
  <script>renderList();</script>
</body>
</html>
