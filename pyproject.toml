[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "official-foreign-travel"
version = "3.0.0"
description = "Data scraping and analysis for U.S. House foreign travel reports"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Data for Democracy / ProPublica"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.0",
    "typing-extensions>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.0.290",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]
llm = [
    "llm>=0.31; python_version>='3.10'",
    "llm-anthropic>=0.25; python_version>='3.10'",
    "llm-ollama>=0.16; python_version>='3.10'",
]

[project.scripts]
oft-download = "official_foreign_travel.cli.download:main"
oft-parse = "official_foreign_travel.cli.parse:main"
oft-test-matching = "official_foreign_travel.cli.test_matching:main"
oft-download-legislators = "official_foreign_travel.cli.download_legislators:main"
oft-review = "official_foreign_travel.cli.review:main"
oft-generate-reference-data = "official_foreign_travel.cli.generate_reference_data:main"

[tool.setuptools.packages.find]
include = ["official_foreign_travel*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "bs4.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `llm` and its plugins pull in dependencies (e.g. click) using syntax newer
# than this project's py3.9 mypy target; skip following into them rather than
# failing to parse their source.
module = [
    "llm",
    "llm.*",
    "llm_ollama",
    "llm_ollama.*",
    "llm_anthropic",
    "llm_anthropic.*",
    "click",
    "click.*",
    "ollama",
    "ollama.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["official_foreign_travel"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
